name: Update Dagger

# Manually-triggered mechanical Dagger upgrade: install the target CLI, regenerate
# every module through hack/regen.sh (which bumps engineVersion + regenerates
# bindings and go.mod/go.sum), bump the workflow's Dagger pin, and open a PR.
# Reproduces the by-hand diff of #114 (v0.20.8 -> v0.21.3) with one click.
#
# A major bump is NOT mechanical: this repository cannot straddle two Dagger
# majors (#440), and v1 removed API the modules used. Expect this workflow to
# open a PR that needs source changes on top of it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Target Dagger version: 'latest', or a pin like 0.21.7 / v0.21.7 /
          1.0.0-beta.13. 'latest' is refused while the repository is pinned to a
          prerelease -- see the resolve step.
        required: false
        default: latest

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Update Dagger modules
    runs-on: ubuntu-latest
    # The first engine round trip cold-pulls the ~633MB engine image (single job,
    # single pull -- cf. #116). Budget generously.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve target version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # The version this repository is on now, read from the same line the bump
          # step rewrites.
          CURRENT=$(sed -n -E '/^      dagger-version:/,/^      [a-z-]+:/ s/.*default:[[:space:]]*"([^"]+)".*/\1/p' \
            .github/workflows/change-aware-ci.yml | head -1)
          [ -n "$CURRENT" ] || { echo "cannot read the current dagger-version pin" >&2; exit 1; }

          if [ -z "$INPUT" ] || [ "$INPUT" = "latest" ]; then
            # gh reports the newest *stable* release, which is older than a
            # prerelease pin rather than newer than it -- resolving 'latest' against
            # a beta would silently open a downgrade PR. A Dagger major is a one-way
            # move for this repository (#440: a module's runtime is rebuilt from
            # freshly generated bindings by whichever engine loads it, so it cannot
            # straddle), so refuse rather than guess. Semver ordering is not
            # something `sort -V` gets right for prereleases, and this workflow is
            # not the place to reimplement it: name the target.
            case "$CURRENT" in
              *-*) echo "the repository is pinned to the prerelease '$CURRENT'; name the target version explicitly rather than 'latest'" >&2; exit 1 ;;
            esac
            TAG=$(gh release view --repo dagger/dagger --json tagName --jq '.tagName')
          else
            TAG="$INPUT"
          fi
          BARE="${TAG#v}"                 # 0.21.7  -- install.sh + workflow pin + branch
          VTAG="v${BARE}"                 # v0.21.7 -- human-facing labels
          # Prereleases are accepted: v1.0.0 is still unreleased and the engine this
          # repository runs is a beta of it, so the mechanical upgrade path has to be
          # able to name one.
          echo "$BARE" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$' \
            || { echo "unexpected version '$TAG'" >&2; exit 1; }
          [ "$BARE" != "$CURRENT" ] \
            || { echo "the repository is already pinned to ${BARE}" >&2; exit 1; }
          echo "bare=$BARE" >> "$GITHUB_OUTPUT"
          echo "vtag=$VTAG" >> "$GITHUB_OUTPUT"

      - name: Install target Dagger CLI
        # Pin the CLI to the EXACT resolved version: codegen writes
        # internal/dagger/dagger.gen.go against the running CLI's engine and CI
        # enforces a byte-exact Generated check, so a CLI even a patch off the
        # target writes mismatched churn. This workflow (not an ambient local CLI)
        # is the source of truth for the regenerated tree.
        env:
          DAGGER_VERSION: ${{ steps.resolve.outputs.bare }}
        run: |
          set -euo pipefail
          curl -fsSL https://dl.dagger.io/dagger/install.sh \
            | DAGGER_VERSION="$DAGGER_VERSION" BIN_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify CLI version
        # Assert PATH resolves to the binary we just installed AND that it reports
        # the exact target -- a stray dagger earlier in PATH (or a bad install)
        # would otherwise silently regenerate the tree with the wrong engine.
        env:
          BARE: ${{ steps.resolve.outputs.bare }}
        run: |
          set -euo pipefail
          RESOLVED="$(command -v dagger)"
          [ "$RESOLVED" = "$HOME/.local/bin/dagger" ] \
            || { echo "dagger resolves to '$RESOLVED', not the freshly installed binary" >&2; exit 1; }
          GOT="$(dagger version | awk '{print $2}')"   # e.g. v0.21.7
          [ "$GOT" = "v${BARE}" ] \
            || { echo "dagger version is '$GOT', expected 'v${BARE}'" >&2; exit 1; }

      - name: Regenerate every module (leaf -> examples -> tests -> root)
        # hack/regen.sh is this repository's `dagger develop`: v1 removed that
        # command in favour of `dagger generate`, which is driven by a workspace
        # dagger.toml this repository does not have, so the script drives the API
        # underneath it instead. It also owns the ordering (a module regenerated
        # before its dependencies embeds their stale type definitions) and the
        # engineVersion bump, and it globs every module shape in the tree --
        # including daggerverse/*/examples/*/, the pass this step used to be missing,
        # which is what stranded six modules at v0.21.7.
        env:
          VTAG: ${{ steps.resolve.outputs.vtag }}
        run: hack/regen.sh "$VTAG"

      - name: Verify every module moved to the target version
        # The upgrade is only mechanical if it reached everything: a module the
        # regeneration pass missed keeps its old pin, and since this repository
        # cannot straddle a major (#440) that is a tree nothing can load rather than
        # a module that lags. Assert it here rather than leaving it to review.
        env:
          VTAG: ${{ steps.resolve.outputs.vtag }}
        run: |
          set -euo pipefail
          rc=0
          while IFS= read -r cfg; do
            got=$(jq -r '.engineVersion // "<none>"' "$cfg")
            if [ "$got" != "$VTAG" ]; then
              echo "::error file=$cfg::engineVersion is '$got', expected '$VTAG'"
              rc=1
            fi
          done < <(find . -name dagger.json -not -path './.git/*' | sort)
          exit "$rc"

      - name: Verify Module.checks still matches `dagger check -l`
        # The planner (daggerverse/workspace-ci) builds the CI matrix by asking
        # each module for its own checks through the Module.checks API, never
        # through a `dagger check -l` stage. If a Dagger upgrade makes that API
        # diverge from what the CLI actually runs, CI would silently under-run: a
        # check the API stops reporting is a check no leg ever runs, and the gate
        # goes green regardless. Compare the two per module at the new version and
        # fail the bump PR on any difference, so a human reconciles before it
        # lands. Same-version tautology today; the guard only bites on a
        # regression.
        #
        # Every module is compared, not a sample, because a divergence could be
        # specific to how one module declares its checks. Enumeration reads the
        # SDK's introspection rather than building a module runtime, so this costs
        # a couple of seconds per module.
        #
        # Both sides are compared as bare check names. `dagger check -l` prints
        # `<name>   # <description>` with no header row and no module prefix -- v1
        # dropped the `<module>:<check>` spelling the previous shape of this guard
        # parsed, and a parser that silently matched nothing would have made the
        # guard pass by finding no checks on either side.
        run: |
          set -uo pipefail
          rc=0
          count=0
          while IFS= read -r cfg; do
            mod="$(dirname "$cfg")"
            stable="$(dagger check -l -m "$mod" 2>/dev/null \
              | sed 's/\x1b\[[0-9;]*m//g' \
              | awk 'NF {print $1}' | sort)"
            enumerated="$(printf '{ moduleSource(refString: "%s") { asModule { checks { list { name } } } } }' "$mod" \
              | dagger api query \
              | jq -r '.moduleSource.asModule.checks.list[].name' | sort)"
            if ! diff <(printf '%s\n' "$stable") <(printf '%s\n' "$enumerated"); then
              echo "::error::Module.checks for $mod diverges from 'dagger check -l' at this Dagger version; the planner may under-run CI. Reconcile before merging." >&2
              rc=1
            fi
            # Plenty of modules legitimately declare no checks of their own --
            # the root module and every service module keep theirs in a sibling
            # tests/ module -- so an empty $stable is the normal case, not a
            # failure. Count with awk rather than `grep -c .`: grep exits 1 when
            # it matches nothing, that status becomes the status of the
            # assignment, and the step runs under `bash -e` (a GitHub default
            # that `set -uo pipefail` does not turn off), so the first
            # checkless module would abort the whole guard with a bare exit 1 --
            # no diff, no ::error::, nothing to read. awk always exits 0.
            count=$(( count + $(printf '%s\n' "$stable" | awk 'NF { n++ } END { print n + 0 }') ))
          done < <(find . -name dagger.json -not -path './.git/*' | sort)
          [ "$rc" -eq 0 ] && echo "check enumeration agrees ($count checks)"
          exit "$rc"

      - name: Bump the Dagger pin in change-aware-ci.yml
        # change-aware-ci.yml is the single source of truth: its `dagger-version`
        # input default is what installs the CLI, keys the engine-image cache and
        # feeds both the list and run jobs, and ci.yml does not override it. One
        # targeted sed on that default line is all that's needed -- no dagger.json
        # edits (hack/regen.sh already bumped every engineVersion).
        env:
          BARE: ${{ steps.resolve.outputs.bare }}
        run: |
          set -euo pipefail
          # Scoped to the dagger-version input's own block, so a semver default
          # added to some other input can never be the thing this rewrites. The
          # value is matched as a loose version-shaped token rather than as three
          # dotted numbers, so a prerelease pin (1.0.0-beta.13) is rewritten too; the
          # block scope is what keeps that loose match from reaching anything else.
          sed -i -E "/^      dagger-version:/,/^      [a-z-]+:/ \
            s/(default:[[:space:]]*\")[0-9][0-9A-Za-z.-]*(\")/\1${BARE}\2/" \
            .github/workflows/change-aware-ci.yml
          # Fail fast if the pin didn't actually land on the target -- a drifted
          # input-default format makes the sed a silent no-op, which would otherwise
          # open a PR carrying a stale pin.
          grep -Eq "default:[[:space:]]*\"${BARE//./\\.}\"" .github/workflows/change-aware-ci.yml \
            || { echo "change-aware-ci.yml dagger-version default was not updated to ${BARE}" >&2; exit 1; }

      - name: Mint a GitHub App installation token
        # GITHUB_TOKEN is itself a GitHub App installation token, and GitHub
        # categorically forbids those from creating/updating files under
        # .github/workflows/ -- so pushing this PR (which bumps the Dagger pin in
        # change-aware-ci.yml) fails with the `workflows` permission rejection (#145).
        # Mint a short-lived token from our own App, which IS installed with
        # Workflows: write. A non-GITHUB_TOKEN author also makes GitHub fire
        # `on: pull_request`, so CI validates the regenerated tree automatically.
        #
        # One-time setup (see README "CI"): an App installed on this repo with
        # Contents/Pull requests/Workflows: write, plus two repo secrets:
        #   UPDATE_DAGGER_APP_ID  -- the App's numeric App ID
        #   UPDATE_DAGGER_APP_KEY -- the App's PEM private key
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.UPDATE_DAGGER_APP_ID }}
          private-key: ${{ secrets.UPDATE_DAGGER_APP_KEY }}

      - name: Open upgrade PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/update-dagger-${{ steps.resolve.outputs.bare }}
          delete-branch: true
          commit-message: "chore(ci): upgrade Dagger to ${{ steps.resolve.outputs.vtag }} across all modules"
          title: "chore(ci): upgrade Dagger to ${{ steps.resolve.outputs.vtag }} across all modules"
          body: |
            Mechanical Dagger upgrade to `${{ steps.resolve.outputs.vtag }}`,
            generated by `.github/workflows/update-dagger.yml`. Reproduces the
            shape of #114: bumped `engineVersion` in every `dagger.json`,
            regenerated `*.gen.go`, refreshed `go.mod`/`go.sum`, and bumped the
            Dagger pin in `change-aware-ci.yml`.

            CI runs automatically on this PR (opened via the update-dagger GitHub
            App rather than `GITHUB_TOKEN`), validating the regenerated tree.
