name: Change-aware CI

# The GitHub Actions half of daggerverse/workspace-ci, published so nobody has to
# copy it. The planner decides *what* to run; this decides *how* Actions runs it —
# engine image caching, the dagger/checks fan-out, recording a pass to the Actions
# cache, and the single status check branch protection can require. None of that is
# specific to this repository, and all of it used to be ~380 lines a consumer had to
# clone and then keep in step with the module.
#
# Adopting it is one `uses:` and (optionally) one token:
#
#   name: CI
#   on:
#     push:
#       branches: [main]
#     pull_request:
#   permissions:
#     contents: read
#     actions: read          # lets the planner read the memoization store
#   jobs:
#     ci:
#       uses: z5labs/devex/.github/workflows/change-aware-ci.yml@main
#       secrets: inherit     # only for DAGGER_CLOUD_TOKEN; omit if you have none
#
# and then requiring `ci / CI Gate` in branch protection. There is no per-check YAML
# to write: the matrix is the planner's output verbatim, so a new module, a new check
# or a renamed one changes nothing here.
#
# Two things a caller owns rather than this file:
#
#   - **Permissions.** This workflow deliberately declares none, so it inherits the
#     calling job's token. A called workflow that *requests* a permission the caller
#     cannot grant fails the run outright, which would make `actions: read` — needed
#     only to read the memo store, whose absence merely costs speed — a hard adoption
#     barrier. Grant `contents: read` and `actions: read` on the caller.
#
#   - **The required status check's name.** GitHub names a called workflow's job
#     `<caller job name> / <job name>`, so the gate below surfaces as
#     `<your job> / CI Gate`. That is stable — it moves only when the caller renames
#     its own job — and is what to require. A repository that already requires some
#     other context can keep it with a two-line job of its own; see this repo's
#     ci.yml.
#
# What the planner's rules are — what counts as a change, what is never memoized, why
# a generated file need not be a global input, how base-image drift is bounded — lives
# in daggerverse/workspace-ci/README.md, next to the code that applies them, rather
# than in comments here that could drift from it.

on:
  workflow_call:
    inputs:
      module:
        description: >-
          The workspace-ci module to plan with, as `dagger -m` takes it. Defaults to
          this repository's published module, which keeps full access to the *calling*
          workspace when invoked by git ref — it discovers your modules, diffs your
          .git and hashes your sources, not this repo's. Pin it to the same ref you
          pinned this workflow to (`...workspace-ci@v1.2.3`); a repository developing
          the planner itself passes the local path instead, so that a change to the
          planner is planned by the changed planner.
        type: string
        default: github.com/z5labs/devex/daggerverse/workspace-ci
      dagger-version:
        description: >-
          The Dagger CLI and engine version. This is the single pin for both: the
          engine image is cached and docker-loaded under it, and the CLI installed at
          it, so the run legs provision from the local image rather than the registry.
        type: string
        default: "0.21.7"
      runs-on:
        description: The runner label for every job here.
        type: string
        default: ubuntu-latest
      base:
        description: >-
          The commit the change is measured from. Empty derives it from the event —
          a PR's base SHA, else the push's before-SHA. GitHub sends an all-zeros
          before for the first push to a branch, which the planner reads as "no
          usable range, run everything".
        type: string
        default: ""
      head:
        description: The commit the change is measured to. Empty derives it from the event.
        type: string
        default: ""
      global-paths:
        description: >-
          Comma-separated path prefixes that govern how CI runs rather than what any
          check computes; a change to one runs everything. Empty takes the planner's
          default of `.github/workflows/`.
        type: string
        default: ""
      split-modules:
        description: >-
          Comma-separated module directories whose checks must each get their own leg
          even when everything runs. The run-everything path otherwise emits one coarse
          leg per module — free when a module's checks share their containers, wrong
          when each check boots a stack of its own. Each name costs one module load in
          the list job, so name only the modules that need it.
        type: string
        default: ""
      timeouts:
        description: >-
          Per-leg check-step budgets in minutes, as a JSON object keyed by a leg's
          display name, by a module directory (which covers every leg of that module),
          or by "<module-dir>:*" (which covers that module's coarse run-everything leg
          alone, since a coarse leg's display name is its module directory).
        type: string
        default: "{}"
      default-timeout:
        description: The check-step budget in minutes for a leg with no override.
        type: number
        default: 6
      list-timeout-minutes:
        description: The job budget for planning, which is bounded by module loads rather than by checks.
        type: number
        default: 20
      max-parallel:
        description: >-
          How many legs may run at once. An uncapped fan-out boots several dozen
          ephemeral engines that all simultaneously pull Docker Hub base images
          (anonymous, per-IP limited via GitHub's shared egress NAT) and flush OTLP
          telemetry to Dagger Cloud; both upstreams answer the thundering herd with
          504s. Do NOT raise this to "speed up CI" without re-checking the 504 rate.
        type: number
        default: 10
      memoize:
        description: >-
          Skip legs a previous run already proved good, and record a pass for the legs
          that run. Set false to run every planned leg every time.
        type: boolean
        default: true
      memo-refs:
        description: >-
          Comma-separated git refs whose Actions cache scopes may be trusted to hold a
          recorded pass. Empty derives the two scopes GitHub itself confines: the
          default branch, and — on a pull request — that pull request's own scope. A
          run can only write caches under its own GITHUB_REF, so no other branch and no
          fork can plant an entry the planner reads. That is stricter than GitHub's own
          restore rules, which would also expose the base branch of a stacked PR. Within
          a PR's own scope the writer is that PR, which is why the planner refuses to
          honour any recorded pass once a global input changed.
        type: string
        default: ""
      memo-ttl:
        description: >-
          How long, in seconds, a recorded pass may be honoured. This is the answer to
          base-image drift, which a source-derived hash cannot see: checks that boot
          real services from floating tags mean an identical tree does not imply an
          identical container. 24h captures essentially all the reuse, which is
          concentrated in hours-scale PR iteration. Do NOT raise it without re-reading
          daggerverse/workspace-ci/README.md.
        type: number
        default: 86400
    secrets:
      MEMO_TOKEN:
        description: >-
          A token with actions:read on this repository, used only to *list* the
          memoization store. Defaults to the run's own GITHUB_TOKEN, which is what the
          caller's `permissions:` block governs. Nothing is ever written with it —
          recording a pass goes through actions/cache/save, which uses its own scoped
          token.
        required: false
      DAGGER_CLOUD_TOKEN:
        description: >-
          Dagger Cloud telemetry. Optional; empty means no telemetry and no failure,
          which is also what a fork pull request gets.
        required: false

env:
  # The memoization store's namespace: a leg that passes records its input hash as a
  # (near-empty) Actions cache entry under this prefix, and a later run whose plan
  # computes the same hash skips that leg.
  #
  # This is workspace-ci's memostore.KeyPrefix. The planner reads exactly this prefix
  # and nothing else, so the two are one constant in two places: changing it here
  # without changing it there silently disables every skip. It is not an input for the
  # same reason — a caller who changed it would quietly memoize nothing.
  MEMO_PREFIX: "workspace-ci-memo-v1-"

jobs:
  list:
    name: List checks
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.list-timeout-minutes }}
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the planner can diff against the PR merge-base / the
          # push's before-SHA. It reads the change set out of this .git directly.
          fetch-depth: 0

      - name: Cache Dagger engine image
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: engine.tar.gz
          key: dagger-engine-v${{ inputs.dagger-version }}

      - name: Load or pull Dagger engine
        env:
          CACHE_HIT: ${{ steps.engine-cache.outputs.cache-hit }}
          DAGGER_VERSION: ${{ inputs.dagger-version }}
        run: |
          IMAGE="registry.dagger.io/engine:v${DAGGER_VERSION}"
          if [ "$CACHE_HIT" = "true" ]; then
            gunzip -c engine.tar.gz | docker load
          else
            for i in 1 2 3; do
              timeout 300 docker pull "$IMAGE" && break
              echo "engine pull attempt $i failed/timed out; retrying in 5s" >&2
              sleep 5
            done
            docker image inspect "$IMAGE" >/dev/null   # fail the job if still missing
            docker save "$IMAGE" | gzip > engine.tar.gz
          fi

      - name: Install Dagger CLI
        # Needed to `dagger call` the planner in the next step. The engine image is
        # already docker-loaded above, so this provisions from the local image (no
        # registry pull).
        env:
          DAGGER_VERSION: ${{ inputs.dagger-version }}
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh \
            | DAGGER_VERSION="$DAGGER_VERSION" BIN_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - id: plan
        # The whole plan is one call to workspace-ci: it discovers the workspace's
        # modules, diffs base...head out of the checkout's .git, attributes each changed
        # path to the modules it is actually an input to, enumerates only those modules'
        # checks, drops the legs a previous run already recorded a pass for, and returns
        # each survivor routed at its own module with a timeout. Nothing here re-derives
        # any of that; the matrix is its output verbatim.
        #
        # The planner fails rather than returning an empty plan, since an empty matrix
        # would skip the run job and pass the gate having run nothing; the guard below
        # is belt and braces for that contract.
        env:
          MODULE: ${{ inputs.module }}
          BASE: ${{ inputs.base || github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ inputs.head || github.event.pull_request.head.sha || github.sha }}
          GLOBAL_PATHS: ${{ inputs.global-paths }}
          SPLIT_MODULES: ${{ inputs.split-modules }}
          TIMEOUTS: ${{ inputs.timeouts }}
          DEFAULT_TIMEOUT: ${{ inputs.default-timeout }}
          MEMOIZE: ${{ inputs.memoize }}
          MEMO_TTL: ${{ inputs.memo-ttl }}
          MEMO_REFS: >-
            ${{ inputs.memo-refs || format('refs/heads/{0}{1}', github.event.repository.default_branch, github.event_name == 'pull_request' && format(',refs/pull/{0}/merge', github.event.pull_request.number) || '') }}
          # Read-only listing of the Actions cache. The planner never writes to the
          # store; writes go through actions/cache/save, which uses its own scoped
          # token instead.
          GH_TOKEN: ${{ secrets.MEMO_TOKEN || github.token }}
          # Export this plan to Dagger Cloud so a run's leg set can be traced back to
          # the decision that produced it. A raw `dagger call` reads the token from its
          # environment, unlike the dagger/checks action the run legs use, which takes
          # it as a cloud-token input. Empty for fork PRs -> no telemetry, no failure.
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
        run: |
          set -euo pipefail

          # Every optional flag is omitted rather than passed empty: `--split-modules=`
          # is a one-element list holding the empty string, not an empty list, and
          # `--global-paths=` would override the planner's own default with nothing.
          args=(--timeouts="$TIMEOUTS" --default-timeout="$DEFAULT_TIMEOUT")
          if [ -n "$GLOBAL_PATHS" ]; then
            args+=(--global-paths="$GLOBAL_PATHS")
          fi
          if [ -n "$SPLIT_MODULES" ]; then
            args+=(--split-modules="$SPLIT_MODULES")
          fi
          if [ "$MEMOIZE" = "true" ] && [ -n "$MEMO_REFS" ]; then
            args+=(
              --memo-token=env:GH_TOKEN
              --memo-repo="$GITHUB_REPOSITORY"
              --memo-refs="$MEMO_REFS"
              --memo-ttl="$MEMO_TTL"
            )
          fi

          jobs="$(dagger -m "$MODULE" call "${args[@]}" \
            plan --base="$BASE" --head="$HEAD" --format=GITHUB_ACTIONS)"
          case "$jobs" in
            ''|'[]') echo "::error::the planner returned no legs"; exit 1 ;;
          esac
          echo "planned legs: $jobs"
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"

  run:
    name: ${{ matrix.job.name }}
    needs: [list]
    runs-on: ${{ inputs.runs-on }}
    # Per matrix leg. This is only a backstop above the leg's dagger/checks step bound
    # (matrix.job.timeout) + setup, so the step's timeout is what fails a
    # telemetry-drain hang fast, not this job cap. The planner computes it as
    # timeout + headroom, because GitHub expressions have no arithmetic.
    timeout-minutes: ${{ matrix.job.jobTimeout }}
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max-parallel }}
      matrix:
        job: ${{ fromJSON(needs.list.outputs.jobs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Dagger engine image
        id: engine-cache
        uses: actions/cache/restore@v4
        with:
          path: engine.tar.gz
          key: dagger-engine-v${{ inputs.dagger-version }}

      - name: Load or pull Dagger engine
        env:
          CACHE_HIT: ${{ steps.engine-cache.outputs.cache-hit }}
          DAGGER_VERSION: ${{ inputs.dagger-version }}
        run: |
          IMAGE="registry.dagger.io/engine:v${DAGGER_VERSION}"
          if [ "$CACHE_HIT" = "true" ]; then
            gunzip -c engine.tar.gz | docker load
          else
            for i in 1 2 3; do
              timeout 300 docker pull "$IMAGE" && break
              echo "engine pull attempt $i failed/timed out; retrying in 5s" >&2
              sleep 5
            done
            docker image inspect "$IMAGE" >/dev/null
          fi

      # Each leg loads only the module that owns its check, never the workspace. An
      # empty filter means "every check this module has", which is what the
      # run-everything path emits (one coarse leg per module, so that path loads no
      # module while planning); the action spells that '**'.
      #
      # The step is bounded separately from the job to fail fast on the Dagger Cloud
      # telemetry-drain hang. The check itself runs in ~1-4m; a leg still going past
      # matrix.job.timeout is almost certainly stuck draining telemetry to
      # api.dagger.cloud (upstream dagger/dagger#7048, #12178), which otherwise hangs
      # the leg until the job timeout. Bounding the step makes the job fail quickly so
      # a re-run lands on a fresh runner + fresh engine — the manual re-run that
      # reliably clears a transient/sustained Cloud stall (an in-process retry can't:
      # it reuses the same stuck engine and re-hits the ongoing stall). Telemetry stays
      # on (cloud-token set); we only bound how long a stuck drain may hang.
      - uses: dagger/checks@64525befa1c36dd55577dae083df5c8968d9325a # v1.1.0
        timeout-minutes: ${{ matrix.job.timeout }}
        with:
          version: ${{ inputs.dagger-version }}
          module: ${{ matrix.job.module }}
          filter: ${{ matrix.job.filter || '**' }}
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      # Record the pass. The entry's whole meaning is its key: the input hash the
      # planner computed for this leg. A later run that computes the same hash skips
      # this leg. The payload exists only because a cache entry needs a path; nothing
      # ever reads it back.
      #
      # Guarded on success() so only a green leg records, and on a non-empty hash so
      # root-module legs and unhashable inputs never do. The hash is passed through
      # from the plan and never recomputed here: this job checks out at depth 1 and
      # could not reproduce it. Best-effort: the write is refused outright on a fork PR
      # and is a no-op when the key already exists, neither of which should fail a leg
      # that passed.
      - name: Record the input hash
        if: ${{ success() && inputs.memoize && matrix.job.hash != '' }}
        env:
          NAME: ${{ matrix.job.name }}
        run: |
          printf 'passed %s\n' "$NAME" > .ci-memo

      - uses: actions/cache/save@v4
        if: ${{ success() && inputs.memoize && matrix.job.hash != '' }}
        continue-on-error: true
        with:
          path: .ci-memo
          key: ${{ env.MEMO_PREFIX }}${{ matrix.job.hash }}

  # Single, stable status check for branch protection. Because the run matrix is
  # dynamic — change-aware and memoized, so unaffected legs and already-proven ones are
  # intentionally absent — the per-leg check names cannot be required directly: a
  # skipped leg would leave its required check pending forever. Require only this one,
  # which GitHub surfaces as `<caller job name> / CI Gate`. It always runs and passes
  # iff `list` succeeded and no executed leg failed (an all-skipped `run` is treated as
  # success — it means every planned leg was already proven, which is the memoization
  # working, and a workspace whose root module declares checks can never reach it since
  # those legs always run and are never memoized).
  gate:
    name: CI Gate
    needs: [list, run]
    if: ${{ always() }}
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Verify required jobs
        env:
          LIST_RESULT: ${{ needs.list.result }}
          RUN_RESULT: ${{ needs.run.result }}
        run: |
          echo "list=$LIST_RESULT run=$RUN_RESULT"
          if [ "$LIST_RESULT" != "success" ]; then
            echo "::error::list job did not succeed"
            exit 1
          fi
          case "$RUN_RESULT" in
            success|skipped) echo "all planned checks passed" ;;
            *) echo "::error::one or more checks failed"; exit 1 ;;
          esac
