name: Update dagger.lock

# Refresh every pin in the committed dagger.lock and open a pull request with the
# result.
#
# dagger.lock is committed (#443) so that the image digests the suites pull and the
# SDK module chain that writes the committed bindings change only in a pull request
# that says so. The cost of pinning is that nothing moves on its own: a base image's
# security fix, or a new go-sdk release, reaches this repository only through here.
# Engine resolution never prunes the file and never refreshes an entry it already
# has, so without this workflow every pin would stay at whatever it first resolved
# to, indefinitely.
#
# `dagger lock update` refreshes every entry, then regenerates every module the SDK
# manages, so a new go-sdk or sdk-helpers arrives with the bindings it writes and
# the pull request's own `dagger-go-sdk:stale` leg is what proves they agree. (It is
# `dagger lock update` on Dagger v1.0.0-beta.15; there is no `dagger workspace
# update`.) A refreshed digest re-runs every suite, which is the point: that run is
# what says the new images still pass.
on:
  schedule:
    # Mondays, 09:00 UTC: early enough in the week that a pull request whose suites
    # fail under a new image gets looked at.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    name: Refresh dagger.lock
    runs-on: ubuntu-latest
    # A cold engine pull plus regenerating every module the SDK manages.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Dagger version is change-aware-ci.yml's `dagger-version` default, read
      # rather than repeated, so the one pin update-dagger.yml bumps covers this
      # workflow too. The sed is the one update-dagger.yml reads it with.
      - id: version
        name: Read the Dagger pin
        run: |
          set -euo pipefail
          version=$(sed -n -E '/^      dagger-version:/,/^      [a-z-]+:/ s/.*default:[[:space:]]*"([^"]+)".*/\1/p' \
            .github/workflows/change-aware-ci.yml | head -1)
          [ -n "$version" ] || { echo "::error::cannot read the dagger-version pin from change-aware-ci.yml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Dagger CLI
        env:
          DAGGER_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          curl -fsSL https://dl.dagger.io/dagger/install.sh \
            | DAGGER_VERSION="$DAGGER_VERSION" BIN_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Refresh every pin and regenerate
        run: dagger lock update

      # A regeneration that changed nothing but the lockfile is the normal case; one
      # that changed nothing at all needs no pull request, and create-pull-request
      # opens none.
      - name: Summarize
        run: git status --short

      # GITHUB_TOKEN is not used to open the pull request: a pull request it opens
      # triggers no `pull_request` workflow, so CI would never run on the refreshed
      # pins — and running every suite against them is the whole point. The App is
      # the one update-dagger.yml uses (see README "CI").
      - name: Mint a GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.UPDATE_DAGGER_APP_ID }}
          private-key: ${{ secrets.UPDATE_DAGGER_APP_KEY }}

      - name: Open the pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/update-dagger-lock
          delete-branch: true
          commit-message: "chore(ci): refresh dagger.lock"
          title: "chore(ci): refresh dagger.lock"
          body: |
            Scheduled refresh of every pin in `dagger.lock`, generated by
            `.github/workflows/update-dagger-lock.yml` with `dagger lock update`:
            image digests, and the Go SDK module chain (`github.com/dagger/go-sdk`,
            `github.com/dagger/sdk-helpers`) together with whatever it now
            generates.

            CI runs every suite against the new pins, because a change to
            `dagger.lock` is a global input. A red leg here is an upstream image
            or SDK release that this repository does not work with yet — fix it
            on this branch or close the pull request and the next run will
            open a fresh one.
