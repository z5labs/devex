name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # Read-only listing of the Actions cache, which is where the memoization store
  # lives (see MEMO_PREFIX). The planner reads it through this token; writes go
  # through actions/cache/save, which uses its own scoped token instead.
  actions: read

env:
  DAGGER_VERSION: "0.21.7"

  # Memoization of check results by input hash. A leg that passes records its
  # input hash as a (near-empty) Actions cache entry under this prefix; a later
  # run whose plan computes the same hash skips that leg.
  #
  # This is workspace-ci's memostore.KeyPrefix. The planner reads exactly this
  # prefix and nothing else, so the two are one constant in two places: changing
  # it here without changing it there silently disables every skip.
  MEMO_PREFIX: "workspace-ci-memo-v1-"

  # How long a recorded pass may be honoured. This is the repo's answer to
  # base-image drift, which a source-derived hash cannot see: these checks boot
  # real services from floating tags, so an identical tree does not imply an
  # identical container. 24h captures essentially all the reuse, which is
  # concentrated in hours-scale PR iteration. Do NOT raise this without
  # re-reading daggerverse/workspace-ci/README.md.
  MEMO_TTL_SECONDS: "86400"

  # Per-leg check-step budgets in minutes; anything unlisted gets the planner's
  # default of 6, which fits every leg that runs one module's suite.
  #
  # The root module is the exception (#184): its `generated` check runs codegen
  # for every module in the workspace, so it pays in one leg the module-build
  # cost the other legs spread across themselves — measured at ~5m of engine work
  # on a cold engine. The "." key covers every root leg, including the single
  # coarse one the run-everything path emits, which runs all three root checks
  # back to back; the two per-check keys tighten the ones that do no such sweep,
  # so a stuck telemetry drain there still fails fast.
  CHECK_TIMEOUTS: '{".": 15, ".:generated-self-test": 8, ".:selection-self-test": 2}'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  list:
    name: List checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the planner can diff against the PR merge-base / the
          # push's before-SHA. It reads the change set out of this .git directly.
          fetch-depth: 0

      - name: Cache Dagger engine image
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: engine.tar.gz
          key: dagger-engine-v${{ env.DAGGER_VERSION }}

      - name: Load or pull Dagger engine
        env:
          CACHE_HIT: ${{ steps.engine-cache.outputs.cache-hit }}
        run: |
          IMAGE="registry.dagger.io/engine:v${DAGGER_VERSION}"
          if [ "$CACHE_HIT" = "true" ]; then
            gunzip -c engine.tar.gz | docker load
          else
            for i in 1 2 3; do
              timeout 300 docker pull "$IMAGE" && break
              echo "engine pull attempt $i failed/timed out; retrying in 5s" >&2
              sleep 5
            done
            docker image inspect "$IMAGE" >/dev/null   # fail the job if still missing
            docker save "$IMAGE" | gzip > engine.tar.gz
          fi

      - name: Install Dagger CLI
        # Needed to `dagger call` the planner in the next step. The engine image
        # is already docker-loaded above, so this provisions from the local image
        # (no registry pull).
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh \
            | DAGGER_VERSION="$DAGGER_VERSION" BIN_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - id: plan
        # The whole plan is one call to daggerverse/workspace-ci: it discovers the
        # workspace's modules, diffs base...head out of the checkout's .git,
        # attributes each changed path to the modules it is actually an input to,
        # enumerates only those modules' checks, drops the legs a previous run
        # already recorded a pass for, and returns each survivor routed at its own
        # module with a timeout. Nothing here re-derives any of that; the matrix is
        # its output verbatim.
        #
        # What the rules are — what counts as a change, what is never memoized, why
        # a generated file need not be a global input, how base-image drift is
        # bounded — lives in daggerverse/workspace-ci/README.md, next to the code
        # that applies them, rather than in comments here that could drift from it.
        #
        # Two trust decisions are this workflow's rather than the planner's, and so
        # are spelled out here:
        #
        #   - which cache scopes may hold a recorded pass. Only two, and both are
        #     ones GitHub itself confines: the default branch, and (on a PR) that
        #     PR's own scope. A run can only write caches under its own GITHUB_REF,
        #     so no other branch and no fork can plant an entry this step reads.
        #     That is stricter than GitHub's own restore rules, which would also
        #     expose the base branch of a stacked PR. Within a PR's own scope the
        #     writer is that PR — which is why the planner refuses to honour any
        #     recorded pass once a global input changed.
        #
        #   - base and head, which come straight from the event: the PR's base and
        #     head, else the push's before/after. GitHub sends an all-zeros before
        #     for the first push to a branch, which the planner reads as "no usable
        #     range, run everything".
        #
        # The planner fails rather than returning an empty plan, since an empty
        # matrix would skip the run job and pass the gate having run nothing; the
        # guard below is belt and braces for that contract.
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          # actions:read on this repository, which is all the planner asks for --
          # it never writes to the store.
          GH_TOKEN: ${{ github.token }}
          MEMO_REFS: >-
            refs/heads/${{ github.event.repository.default_branch }}${{ github.event_name == 'pull_request' && format(',refs/pull/{0}/merge', github.event.pull_request.number) || '' }}
          # Export this plan to Dagger Cloud so a run's leg set can be traced back
          # to the decision that produced it (#180). A raw `dagger call` reads the
          # token from its environment, unlike the dagger/checks action the run legs
          # use, which takes it as a cloud-token input. Empty for fork PRs -> no
          # telemetry, no failure.
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
        run: |
          set -euo pipefail
          jobs="$(dagger -m daggerverse/workspace-ci call \
            --timeouts="$CHECK_TIMEOUTS" \
            --memo-token=env:GH_TOKEN \
            --memo-repo="$GITHUB_REPOSITORY" \
            --memo-refs="$MEMO_REFS" \
            --memo-ttl="$MEMO_TTL_SECONDS" \
            plan --base="$BASE" --head="$HEAD" --format=GITHUB_ACTIONS)"
          case "$jobs" in
            ''|'[]') echo "::error::the planner returned no legs"; exit 1 ;;
          esac
          echo "planned legs: $jobs"
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"

  run:
    name: ${{ matrix.job.name }}
    needs: [list]
    runs-on: ubuntu-latest
    # Per matrix leg. Observed real legs finish in <4m; this is only a backstop
    # above the leg's dagger/checks step bound (matrix.job.timeout) + setup, so
    # the step's timeout is what fails a telemetry-drain hang fast, not this job
    # cap. The planner computes it as timeout + headroom, because GitHub
    # expressions have no arithmetic.
    timeout-minutes: ${{ matrix.job.jobTimeout }}
    strategy:
      fail-fast: false
      # Burst-throttling mitigation (#125): the matrix fans out one leg per check,
      # so an uncapped fan-out boots several dozen ephemeral engines at once that
      # all simultaneously pull Docker Hub base images (anonymous, per-IP limited
      # via GitHub's shared egress NAT) and flush OTLP telemetry to Dagger Cloud.
      # Both upstreams answer the resulting thundering herd with 504s. Cap
      # concurrent legs to spread the same load over time — remaining legs queue
      # and start as slots free. Same shape as #116's cold engine-image pull. Do
      # NOT raise this to "speed up CI" without re-checking the 504 rate.
      max-parallel: 10
      matrix:
        job: ${{ fromJSON(needs.list.outputs.jobs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Dagger engine image
        id: engine-cache
        uses: actions/cache/restore@v4
        with:
          path: engine.tar.gz
          key: dagger-engine-v${{ env.DAGGER_VERSION }}

      - name: Load or pull Dagger engine
        env:
          CACHE_HIT: ${{ steps.engine-cache.outputs.cache-hit }}
        run: |
          IMAGE="registry.dagger.io/engine:v${DAGGER_VERSION}"
          if [ "$CACHE_HIT" = "true" ]; then
            gunzip -c engine.tar.gz | docker load
          else
            for i in 1 2 3; do
              timeout 300 docker pull "$IMAGE" && break
              echo "engine pull attempt $i failed/timed out; retrying in 5s" >&2
              sleep 5
            done
            docker image inspect "$IMAGE" >/dev/null
          fi

      # Each leg loads only the module that owns its check, never the workspace.
      # An empty filter means "every check this module has", which is what the
      # run-everything path emits (one coarse leg per module, so that path loads
      # no module while planning); the action spells that '**'.
      #
      # The step is bounded separately from the job to fail fast on the Dagger
      # Cloud telemetry-drain hang. The check itself runs in ~1-4m; a leg still
      # going past matrix.job.timeout is almost certainly stuck draining telemetry
      # to api.dagger.cloud (upstream dagger/dagger#7048, #12178), which otherwise
      # hangs the leg until the job timeout. Bounding the step makes the job fail
      # quickly so ci-auto-rerun.yml re-runs the failed leg on a fresh runner +
      # fresh engine — the manual re-run that reliably clears a transient/sustained
      # Cloud stall (an in-process retry can't: it reuses the same stuck engine and
      # re-hits the ongoing stall). Telemetry stays on (cloud-token set); we only
      # bound how long a stuck drain may hang.
      - uses: dagger/checks@64525befa1c36dd55577dae083df5c8968d9325a # v1.1.0
        timeout-minutes: ${{ matrix.job.timeout }}
        with:
          version: ${{ env.DAGGER_VERSION }}
          module: ${{ matrix.job.module }}
          filter: ${{ matrix.job.filter || '**' }}
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      # Record the pass. The entry's whole meaning is its key: the input hash the
      # planner computed for this leg. A later run that computes the same hash
      # skips this leg. The payload exists only because a cache entry needs a path;
      # nothing ever reads it back.
      #
      # Guarded on success() so only a green leg records, and on a non-empty hash
      # so root-module legs and unhashable inputs never do. The hash is passed
      # through from the plan and never recomputed here: this job checks out at
      # depth 1 and could not reproduce it. Best-effort: the write is refused
      # outright on a fork PR and is a no-op when the key already exists, neither
      # of which should fail a leg that passed.
      - name: Record the input hash
        if: ${{ success() && matrix.job.hash != '' }}
        env:
          NAME: ${{ matrix.job.name }}
        run: |
          printf 'passed %s\n' "$NAME" > .ci-memo

      - uses: actions/cache/save@v4
        if: ${{ success() && matrix.job.hash != '' }}
        continue-on-error: true
        with:
          path: .ci-memo
          key: ${{ env.MEMO_PREFIX }}${{ matrix.job.hash }}

  # Single, stable status check for branch protection. Because the run matrix is
  # dynamic — change-aware and memoized, so unaffected legs and already-proven ones
  # are intentionally absent — the per-leg check names cannot be required directly:
  # a skipped leg would leave its required check pending forever. Require ONLY
  # "CI Gate" in branch protection instead. It always runs and passes iff `list`
  # succeeded and no executed leg failed (an all-skipped `run` — impossible today,
  # since the root module's legs always run and are never memoized — is treated as
  # success).
  gate:
    name: CI Gate
    needs: [list, run]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          LIST_RESULT: ${{ needs.list.result }}
          RUN_RESULT: ${{ needs.run.result }}
        run: |
          echo "list=$LIST_RESULT run=$RUN_RESULT"
          if [ "$LIST_RESULT" != "success" ]; then
            echo "::error::list job did not succeed"
            exit 1
          fi
          case "$RUN_RESULT" in
            success|skipped) echo "all planned checks passed" ;;
            *) echo "::error::one or more checks failed"; exit 1 ;;
          esac
