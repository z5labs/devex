name: CI

# This repository's CI is the reusable workflow it publishes, called with this
# repository's configuration, plus one job of its own. Everything that used to live
# here — engine image caching, the plan call, the fan-out of one `dagger check` per
# leg, recording a pass, the gate — is in change-aware-ci.yml, so the rules exist
# once and this repo is a consumer of them like any other.
#
# What is genuinely local:
#
#   - `module` points at the in-tree planner rather than the published git ref, so
#     a pull request that changes the planner is planned by the changed planner.
#   - The planner-tests job below runs workspace-ci's own tests whenever a CI file
#     changes, decided by a plain `git diff` rather than by that planner.
#
# The root module has one check, `ci:generated`. The two it used to carry beside it
# are gone (#446): `generated-self-test`, because `generated` now proves on every
# run that it can fail and that it swept every module; and `selection-self-test`,
# because everything it read is already a global input the plan runs everything
# for, and planner-tests runs it directly whenever that input changes.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # Read-only listing of the Actions cache, which is where the memoization store
  # lives. The planner reads it through this token; writes go through
  # actions/cache/save, which uses its own scoped token instead. The called workflow
  # declares no permissions of its own — a called workflow that requests more than
  # its caller can grant fails the run outright — so this block is what governs it.
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/change-aware-ci.yml
    with:
      # The in-tree planner, not github.com/z5labs/devex/daggerverse/workspace-ci.
      # A change to the planner must be planned by the changed planner, or a pull
      # request could not test its own selection logic.
      module: daggerverse/workspace-ci

      # Modules whose checks must each get their own leg even when everything runs.
      # The run-everything path otherwise emits one coarse leg per module, which
      # shares one engine on one runner — free when a module's checks share their
      # containers (13 grafana-stack checks land in ~1m30s), wrong when each check
      # boots a stack of its own.
      #
      # kafka/tests is the latter: its five checks bring up five different Kafka
      # distributions, 87 brokers/controllers/registries in one engine. Under that
      # load a broker loses the race to reach its KRaft controller and dies (#307),
      # which failed 3 of 3 attempts of one run here while the same check has not
      # failed on main in 20 runs. Splitting it restores main's layout: five legs,
      # five runners, five engines.
      #
      # Each name costs one module load in the list job, so this stays a short list
      # of modules that need it rather than every module with more than one check.
      split-modules: daggerverse/kafka/tests

      # Per-leg check-step budgets in minutes; anything unlisted gets the planner's
      # default of 6, which fits a leg that runs a single check and — since a
      # module's checks run concurrently and share their container builds — most
      # coarse legs too.
      #
      # Three key shapes: `<dir>` covers every leg of a module, `<dir>:*` covers only
      # that module's coarse run-everything leg, and `<dir>:<check>` covers one
      # per-check leg. The middle shape exists because a coarse leg's name *is* the
      # module directory (#306), so a bare module key cannot mean "the coarse leg
      # only" and a whole-suite budget would otherwise be inherited by legs that each
      # run a single check.
      #
      # What the entries below are for:
      #
      #   .                        the root module's one check, `generated`, runs
      #                            codegen for every module in the workspace, paying
      #                            in one leg the module-build cost the others spread
      #                            across themselves (#184) — ~5m on a cold engine. A
      #                            bare module key, because that sweep is every leg
      #                            the root module has.
      #   daggerverse/workspace-ci declares that same whole-workspace `generated` as
      #                            its own check, so its coarse leg repeats the
      #                            sweep; measured at 5m12s against the 6m default.
      #                            Here the coarse budget is bound to `:*` and to
      #                            `:generated`, the two legs that actually sweep, so
      #                            `:selection-self-test` and `:memo-store-self-test`
      #                            — both in-process, no engine work — fall back to
      #                            the default instead of carrying 15.
      #   daggerverse/z5labs/tests one check, `all`, which runs a publish suite: two
      #                            registries, an OIDC issuer, a local sigstore, and
      #                            cross-compiles per platform. It had outgrown the
      #                            default without anyone noticing, because a leg that
      #                            fits by a second still passes — measured at exactly
      #                            6m00s against the 6m budget on main (run
      #                            31716230729), and the first commit to add anything
      #                            to the suite (#424) came back a timeout rather than
      #                            a failure. A bare module key, because the module
      #                            has the one check and the coarse leg runs it too
      #                            — which is also why `split-modules` above does
      #                            nothing for it and why this is a budget increase
      #                            rather than a fix. Splitting the suite so the
      #                            number can come back down is #433.
      timeouts: >-
        {".": 15,
        "daggerverse/workspace-ci:*": 15, "daggerverse/workspace-ci:generated": 15,
        "daggerverse/z5labs/tests": 12}

    # Only DAGGER_CLOUD_TOKEN is actually consumed; MEMO_TOKEN is left unset so the
    # called workflow falls back to this run's own GITHUB_TOKEN, scoped by the
    # permissions block above.
    secrets: inherit

  # Whether this change touches the files CI is made of. Decided by a plain
  # `git diff`, never by the planner, because what it gates is the planner's own
  # tests: a planner change that stopped scheduling those tests would be planned
  # by that same changed planner, and nothing would notice. The planner already
  # treats every one of these paths as global, so this duplicates legs the plan
  # also runs — on purpose; the point is that this path does not depend on it.
  #
  # It is a job in this workflow rather than a workflow of its own with a `paths`
  # filter. A workflow skipped by `paths` leaves its checks Pending, so it cannot
  # be a required check and auto-merge.yaml would merge without waiting for it;
  # ci-auto-rerun.yml only watches the `CI` workflow, so an infra flake there
  # would never be retried. Here a skip is a real `skipped` that `CI Gate` reads.
  #
  # The path list is the CI files: the workflows and their scripts, the root
  # module (its source and its config in either shape), the workspace config, the
  # planner itself and the regeneration script. Anything it cannot decide — no
  # usable base, a diff that fails — runs the tests rather than skipping them.
  ci-files:
    name: CI files changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: diff
        name: Diff against the base
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          run=true
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "no usable base; running the planner tests"
          elif ! changed="$(git diff --name-only "${BASE}...${HEAD}")"; then
            echo "cannot diff ${BASE}...${HEAD}; running the planner tests"
          elif grep -qE '^(\.github/workflows/|\.github/scripts/|ci/|daggerverse/workspace-ci/|hack/)|^(dagger\.json|dagger-module\.toml|dagger\.toml)$' <<<"$changed"; then
            echo "CI files changed; running the planner tests"
          else
            echo "no CI file changed; skipping the planner tests"
            run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  # workspace-ci's planner tests, run directly rather than as legs of the plan:
  # the in-process selection and memo-store self-tests, and the fixture suite in
  # daggerverse/workspace-ci/tests. See ci-files above for why.
  planner-tests:
    name: Planner tests
    needs: [ci-files]
    if: ${{ needs.ci-files.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Dagger version is change-aware-ci.yml's `dagger-version` default, read
      # rather than repeated, so the one pin update-dagger.yml bumps covers this
      # job too. The sed is the one update-dagger.yml reads it with.
      - id: version
        name: Read the Dagger pin
        run: |
          set -euo pipefail
          version=$(sed -n -E '/^      dagger-version:/,/^      [a-z-]+:/ s/.*default:[[:space:]]*"([^"]+)".*/\1/p' \
            .github/workflows/change-aware-ci.yml | head -1)
          [ -n "$version" ] || { echo "::error::cannot read the dagger-version pin from change-aware-ci.yml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Dagger engine image
        id: engine-cache
        uses: actions/cache/restore@v4
        with:
          path: engine.tar.gz
          key: dagger-engine-v${{ steps.version.outputs.version }}

      - name: Load or pull Dagger engine
        env:
          CACHE_HIT: ${{ steps.engine-cache.outputs.cache-hit }}
          DAGGER_VERSION: ${{ steps.version.outputs.version }}
        run: |
          IMAGE="registry.dagger.io/engine:v${DAGGER_VERSION}"
          if [ "$CACHE_HIT" = "true" ]; then
            gunzip -c engine.tar.gz | docker load
          else
            for i in 1 2 3; do
              timeout 300 docker pull "$IMAGE" && break
              echo "engine pull attempt $i failed/timed out; retrying in 5s" >&2
              sleep 5
            done
            docker image inspect "$IMAGE" >/dev/null
          fi

      - name: Install Dagger CLI
        env:
          DAGGER_VERSION: ${{ steps.version.outputs.version }}
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh \
            | DAGGER_VERSION="$DAGGER_VERSION" BIN_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Named checks, scoped with --module so the root module's checks are not
      # selected alongside them. One pattern per command: a pattern that matches
      # nothing fails, which is what turns a renamed or deleted self-test red, but
      # only when it is alone — patterns in one command are OR'd, so `dagger check
      # a b` passes on `a` alone when `b` matches nothing (measured on
      # v1.0.0-beta.15).
      - name: Selection and memo-store self-tests
        timeout-minutes: 6
        env:
          DAGGER_PROGRESS: dots
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
        run: |
          set -euo pipefail
          dagger -m daggerverse/workspace-ci check --module workspace-ci 'workspace-ci:selection-self-test'
          dagger -m daggerverse/workspace-ci check --module workspace-ci 'workspace-ci:memo-store-self-test'

      # Every check the tests module has. Unlike a coarse plan leg this does not
      # list first: this module must have checks, and `dagger check` selecting
      # nothing is an error, which is the right answer here.
      - name: Fixture suite
        timeout-minutes: 12
        env:
          DAGGER_PROGRESS: dots
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
        run: dagger -m daggerverse/workspace-ci/tests check --module tests

  # The required status check. The called workflow already exposes one, but GitHub
  # names a called job `<caller job name> / <job name>` — `Checks / CI Gate` here —
  # and this repository's ruleset requires the bare context `CI Gate`, which predates
  # the extraction. Renaming a required check is a repository-settings change with a
  # window in which nothing satisfies the rule, so the context stays put and this job
  # republishes the called workflow's verdict under it.
  #
  # It also carries the planner tests' verdict. A skip there is a pass — no CI file
  # changed — but only when the job that decided to skip succeeded: a job whose
  # `needs` failed is reported as skipped too, so ci-files is required on its own.
  #
  # A repository adopting change-aware-ci.yml fresh needs none of this: require
  # `<your job> / CI Gate` directly and delete the idea.
  gate:
    name: CI Gate
    needs: [checks, ci-files, planner-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify the called workflow's gate and the planner tests
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          CI_FILES_RESULT: ${{ needs.ci-files.result }}
          PLANNER_RESULT: ${{ needs.planner-tests.result }}
        run: |
          echo "checks=$CHECKS_RESULT ci-files=$CI_FILES_RESULT planner-tests=$PLANNER_RESULT"
          rc=0
          if [ "$CHECKS_RESULT" != "success" ]; then
            echo "::error::change-aware CI did not succeed"
            rc=1
          fi
          if [ "$CI_FILES_RESULT" != "success" ]; then
            echo "::error::could not decide whether the planner tests must run"
            rc=1
          fi
          case "$PLANNER_RESULT" in
            success|skipped) ;;
            *) echo "::error::the planner tests did not succeed"; rc=1 ;;
          esac
          [ "$rc" -eq 0 ] && echo "all planned checks passed"
          exit "$rc"
