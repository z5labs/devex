name: CI

# This repository's CI is the reusable workflow it publishes, called with this
# repository's configuration and nothing else. Everything that used to live here —
# engine image caching, the plan call, the dagger/checks fan-out, recording a pass,
# the gate — is in change-aware-ci.yml, so the rules exist once and this repo is a
# consumer of them like any other.
#
# The one thing that is genuinely local: `module` points at the in-tree planner
# rather than the published git ref, so a pull request that changes the planner is
# planned by the changed planner.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # Read-only listing of the Actions cache, which is where the memoization store
  # lives. The planner reads it through this token; writes go through
  # actions/cache/save, which uses its own scoped token instead. The called workflow
  # declares no permissions of its own — a called workflow that requests more than
  # its caller can grant fails the run outright — so this block is what governs it.
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/change-aware-ci.yml
    with:
      # The in-tree planner, not github.com/z5labs/devex/daggerverse/workspace-ci.
      # A change to the planner must be planned by the changed planner, or a pull
      # request could not test its own selection logic.
      module: daggerverse/workspace-ci

      # Modules whose checks must each get their own leg even when everything runs.
      # The run-everything path otherwise emits one coarse leg per module, which
      # shares one engine on one runner — free when a module's checks share their
      # containers (13 grafana-stack checks land in ~1m30s), wrong when each check
      # boots a stack of its own.
      #
      # kafka/tests is the latter: its five checks bring up five different Kafka
      # distributions, 87 brokers/controllers/registries in one engine. Under that
      # load a broker loses the race to reach its KRaft controller and dies (#307),
      # which failed 3 of 3 attempts of one run here while the same check has not
      # failed on main in 20 runs. Splitting it restores main's layout: five legs,
      # five runners, five engines.
      #
      # Each name costs one module load in the list job, so this stays a short list
      # of modules that need it rather than every module with more than one check.
      split-modules: daggerverse/kafka/tests

      # Per-leg check-step budgets in minutes; anything unlisted gets the planner's
      # default of 6, which fits a leg that runs a single check and — since a
      # module's checks run concurrently and share their container builds — most
      # coarse legs too.
      #
      #   .                        the root module's `generated` runs codegen for
      #                            every module in the workspace, paying in one leg
      #                            the module-build cost the others spread across
      #                            themselves (#184) — ~5m on a cold engine. Its two
      #                            per-check keys tighten the checks that do no such
      #                            sweep.
      #   daggerverse/workspace-ci declares that same whole-workspace `generated` as
      #                            its own check, so its coarse leg repeats the
      #                            sweep; measured at 5m12s against the 6m default.
      #
      # A module key covers that module's coarse leg AND its per-check legs, since a
      # coarse leg's name *is* the module directory (#306). Neither key above names a
      # module that also produces per-check legs worth tightening, so nothing here is
      # bound more loosely than it needs to be.
      timeouts: >-
        {".": 15, ".:generated-self-test": 8, ".:selection-self-test": 2,
        "daggerverse/workspace-ci": 15}

    # Only DAGGER_CLOUD_TOKEN is actually consumed; MEMO_TOKEN is left unset so the
    # called workflow falls back to this run's own GITHUB_TOKEN, scoped by the
    # permissions block above.
    secrets: inherit

  # The required status check. The called workflow already exposes one, but GitHub
  # names a called job `<caller job name> / <job name>` — `Checks / CI Gate` here —
  # and this repository's ruleset requires the bare context `CI Gate`, which predates
  # the extraction. Renaming a required check is a repository-settings change with a
  # window in which nothing satisfies the rule, so the context stays put and this job
  # republishes the called workflow's verdict under it.
  #
  # A repository adopting change-aware-ci.yml fresh needs none of this: require
  # `<your job> / CI Gate` directly and delete the idea.
  gate:
    name: CI Gate
    needs: [checks]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify the called workflow's gate
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          echo "checks=$CHECKS_RESULT"
          if [ "$CHECKS_RESULT" != "success" ]; then
            echo "::error::change-aware CI did not succeed"
            exit 1
          fi
          echo "all planned checks passed"
